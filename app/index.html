<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Semear: jornada de aprendizado e materiais para imprimir, para famílias educadoras."

    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; connect-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; object-src 'none'; base-uri 'self'; form-action 'self'"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Semear: jornada de aprendizado para famílias educadoras" />
    <meta
      property="og:description"
      content="Posicione seu filho (2 a 8 anos) na jornada e imprima a sessão de hoje. A criança não usa tela e os dados ficam no seu aparelho."
    />
    <meta name="theme-color" content="#355e45" />
    <title>Semear</title>
    <link rel="icon" href="./icone.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

  <body>
    <header class="topo">
      <a class="marca" href="#/"
        ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 21v-8" />
          <path d="M12 13c0-4-3-6-7-6 0 4 3 6 7 6Z" />
          <path d="M12 11c0-3.5 2.5-5.5 7-5.5 0 3.5-2.5 5.5-7 5.5Z" /></svg
        >Semear</a
      >
      <a class="versao" id="versao" href="#/novidades" title="Versão publicada · ver novidades"></a>
      <nav aria-label="Principal">
        <a href="#/" data-rota="/"
          ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 11 12 4l8 7" />
            <path d="M6 10v10h12V10" /></svg
          ><span>Início</span></a
        >
        <a href="#/sessao/nova" data-rota="/sessao"
          ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="5" y="3" width="14" height="18" rx="2" />
            <path d="M9 8h6M9 12h6M9 16h4" /></svg
          ><span>Sessão</span></a
        >
        <a href="#/atividades" data-rota="/atividades"
          ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M5 4h9a4 4 0 0 1 4 4v12H9a4 4 0 0 1-4-4Z" />
            <path d="M9 20V8" /></svg
          ><span>Atividades</span></a
        >
        <a href="#/config" data-rota="/config"
          ><svg class="icone" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1"
            /></svg
          ><span>Config.</span></a
        >
      </nav>
    </header>
    <div id="faixa-exemplo" class="faixa-exemplo" role="note" hidden>
      Você está vendo um exemplo.
      <button type="button" id="apagar-exemplo" class="link-botao">Apagar exemplo</button>
    </div>
    <div id="faixa-atualizar" class="faixa-atualizar" role="status" hidden>
      Nova versão disponível.
      <button type="button" id="atualizar-app" class="link-botao">Atualizar</button>
    </div>
    <main id="app" class="conteudo-app"><p class="nota">Carregando…</p></main>
    <div id="aviso" class="aviso-flutuante" role="status" aria-live="polite" hidden></div>
    <script type="module" src="./src/main.ts"></script>
