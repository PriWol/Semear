<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <title>Semear</title>
    <meta name="robots" content="noindex" />
    <script>
      // Endereços antigos (ex.: /Semear/weekly-plan) ou inexistentes voltam para o início do app.
      // O app vive em /Semear/ (GitHub Pages de projeto). O hash é mantido (ex.: #/familia).
      (function () {
        var base = location.pathname.indexOf('/Semear/') === 0 ? '/Semear/' : '/';
        // Se a própria base deu 404 (ex.: publicação quebrada), não redireciona: evita um loop.
        if (location.pathname !== base) location.replace(base + location.hash);
      })();
    </script>
  </head>
  <body>
    <p>Redirecionando para o <a href="/Semear/">Semear</a>…</p>
  </body>
</html>
