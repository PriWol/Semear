name: Mesclagem automática

# Papel do DevOps/Release (ADR 0029): liga a mesclagem automática só em PR elegível. As verificações
# obrigatórias do ruleset "Proteger main" continuam valendo: o merge só ocorre com CI verde.
# Nunca roda código do PR: só lê a lista de arquivos e rótulos por API.

on:
  workflow_run:
    workflows: ['Revisão por agentes']
    types: [completed]

permissions:
  contents: write
  pull-requests: write

jobs:
  elegibilidade:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Avaliar e ligar a mesclagem automática
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          pr=$(gh api "repos/$REPO/commits/$HEAD_SHA/pulls" --jq '.[0].number // empty')
          [ -z "$pr" ] && { echo "sem PR para $HEAD_SHA"; exit 0; }
          info=$(gh api "repos/$REPO/pulls/$pr")
          [ "$(jq -r '.draft' <<<"$info")" = "true" ] && { echo "rascunho"; exit 0; }
          [ "$(jq -r '.user.type' <<<"$info")" = "Bot" ] && { echo "PR de bot: fica com a dona do produto"; exit 0; }
          if jq -e '.labels[].name | select(. == "bloqueado" or . == "conteudo" or . == "decisao")' <<<"$info" >/dev/null; then
            echo "rótulo impede mesclagem automática"; exit 0
          fi
          # caminhos que sempre exigem a dona do produto
          if gh api "repos/$REPO/pulls/$pr/files" --paginate --jq '.[].filename' \
             | grep -E '^(app/content/|app/src/dados/|\.github/|CLAUDE\.md|docs/adr/)|csp|Content-Security' ; then
            echo "toca caminho sensível: fica com a dona do produto"; exit 0
          fi
          gh pr merge "$pr" --repo "$REPO" --auto --squash
          gh pr comment "$pr" --repo "$REPO" --body "Elegível à mesclagem automática (sem conteúdo, dados, CSP, workflows ou ADR; revisores sem bloqueio). Mescla assim que as verificações obrigatórias ficarem verdes.

---
_Gerado pelo processo AI-SDLC (ADR 0029)_"
