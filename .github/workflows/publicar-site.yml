name: Publicar site

# Publica o app no GitHub Pages quando um merge no main altera app/ (ADR 0009).
# Mudanças só em docs/ não publicam, porque docs/ não faz parte do site.
# Requer, uma única vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-site.yml']
  workflow_dispatch:

# Só leitura por padrão: o job que roda npm ci (código de terceiros) não recebe permissão de publicar.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e compilar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Nunca publica algo que não passa nas verificações (os e2e rodam no PR, exigidos pela proteção do main).
      - run: npm run check
      # Sem configure-pages: o app usa caminhos relativos (base './'), e a etapa exigiria a
      # permissão pages no job que roda código de terceiros (npm ci).
      - run: npm run build
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: app/dist

  publicar:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
