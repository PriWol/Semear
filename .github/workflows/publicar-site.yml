name: Publicar site

# Publica o app no GitHub Pages quando um merge no main altera app/ (ADR 0009).
# Mudanças só em docs/ não publicam, porque docs/ não faz parte do site.
# Requer, uma única vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-site.yml']
  workflow_dispatch:

# Só leitura por padrão: o job que roda npm ci (código de terceiros) não recebe permissão de publicar.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e compilar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Nunca publica algo que não passa nas verificações (os e2e rodam no PR, exigidos pela proteção do main).
      - run: npm run check
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  publicar:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@v4
