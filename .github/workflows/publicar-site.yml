name: Publicar site

# Publica o app no GitHub Pages quando um merge no main altera app/ (ADR 0009).
# Mudanças só em docs/ não publicam, porque docs/ não faz parte do site.
# Requer, uma única vez: Settings → Pages → Build and deployment → Source: "GitHub Actions".

on:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/publicar-site.yml']
  workflow_dispatch:

# Só leitura por padrão: o job que roda npm ci (código de terceiros) não recebe permissão de publicar.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Verificar e compilar
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      # Nunca publica algo que não passa nas verificações (os e2e rodam no PR, exigidos pela proteção do main).
      - run: npm run check
      # Sem configure-pages: o app usa caminhos relativos (base './'), e a etapa exigiria a
      # permissão pages no job que roda código de terceiros (npm ci).
      - run: npm run build
      # Biblioteca (ADR 0015): os PDFs do Tesouro não ficam no Git; vêm da Release e são servidos
      # pelo próprio site (mesma origem, abrem na página certa). Release pública: sem token.
      # A lista sai do catálogo app/content/tesouro.json, para site e catálogo não divergirem.
      - name: Baixar os PDFs do Tesouro
        run: |
          mkdir -p dist/tesouro
          # A conferência de páginas precisa do pdfinfo (poppler-utils); sem ele o passo falha, não pula.
          command -v pdfinfo > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils; } || { echo "::error::não foi possível instalar o pdfinfo (poppler-utils)"; exit 1; }
          # Volumes e cadernos para 2 anos (ADR 0015, adendo): uma linha "arquivo paginas" por PDF.
          node -e "const c = require('./content/tesouro.json'); for (const v of [...c.volumes, ...c.cadernos]) console.log(v.arquivo.replace('tesouro/', ''), v.paginas)" > ../lista-tesouro.txt
          while read -r arquivo paginas; do
            # O nome vem do catálogo: só nome simples de PDF, nunca caminho (../) nem espaço.
            if ! echo "$arquivo" | grep -Eq '^[A-Za-z0-9._-]+\.pdf$' || [[ "$arquivo" == *..* ]]; then
              echo "::error::nome de arquivo inválido: $arquivo"; exit 1
            fi
            curl --fail --silent --show-error --location --retry 3 \
              --output "dist/tesouro/$arquivo" \
              "https://github.com/${{ github.repository }}/releases/download/tesouro-marina/$arquivo"
            head -c 5 "dist/tesouro/$arquivo" | grep -q '^%PDF-'
            # Confere a paginação do catálogo com a do PDF.
            reais=$(pdfinfo "dist/tesouro/$arquivo" | awk '/^Pages:/ {print $2}')
            [ "$reais" = "$paginas" ] || { echo "::error::$arquivo tem $reais páginas; o catálogo diz $paginas"; exit 1; }
          done < ../lista-tesouro.txt
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app/dist

  publicar:
    name: Publicar no GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publicacao.outputs.page_url }}
    steps:
      - id: publicacao
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
