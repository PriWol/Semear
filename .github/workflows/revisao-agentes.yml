name: Revisão por agentes

# Revisores por papel em cada PR (ADR 0007, ampliado pelo ADR 0029). Requer o segredo
# CLAUDE_CODE_OAUTH_TOKEN ou ANTHROPIC_API_KEY. Achado bloqueante recebe o rótulo `bloqueado`,
# que impede a mesclagem automática (merge-automatico.yml).
# Atenção: por segurança, a ação só roda quando este arquivo já existe, idêntico, no branch padrão.
# No PR que cria ou altera este arquivo, os revisores são pulados (e aparecem como "sucesso").

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  revisor:
    # PR do Dependabot não tem acesso aos segredos do repositório e a ação recusa atores bot (ADR 0007).
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    name: Revisor (${{ matrix.agente }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - agente: dev-senior-b
            instrucoes: >-
              Use o subagente `dev-senior-b` como revisor de CORREÇÃO E ARQUITETURA: bugs, divergências com
              docs/JORNADA_SPEC.md, violações do CLAUDE.md (camadas, convenções, definição de pronto),
              migração de dados ausente e regras de negócio sem teste.
          - agente: qa
            instrucoes: >-
              Use o subagente `qa`: cada critério de aceite da estória ligada (Closes/Refs) tem teste que
              falharia sem a mudança? Casos de borda e faixa etária cobertos? Aponte lacunas.
          - agente: seguranca-privacidade
            instrucoes: >-
              Use o subagente `seguranca-privacidade` com o checklist completo. Tem poder de veto.
          - agente: designer
            instrucoes: >-
              Use o subagente `designer`. Se o PR não toca telas, folhas, CSS ou tokens, responda em uma
              linha que não se aplica. Caso contrário revise contra docs/DESIGN.md e os tokens --s-*.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # fixada por SHA (v1) porque recebe segredos; atualizar conscientemente
      - uses: anthropics/claude-code-action@cc98b3ae241b0fcfb6a42a2690751afffecb4452 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # PRs abertos pelos agentes do ciclo (ciclo-agentes.yml) saem como claude[bot]; sem isto os 4 revisores
          # falham em 1 s com "non-human actor". Só esse bot, nunca '*'.
          allowed_bots: 'claude'
          prompt: |
            REPO: ${{ github.repository }}
            PR: ${{ github.event.pull_request.number }}

            ${{ matrix.instrucoes }}

            Leia o CLAUDE.md antes de revisar. Revise apenas as mudanças deste PR.
            Escreva em português. Publique os achados como comentários inline e termine com um
            comentário-resumo por gravidade (bloqueante / importante / sugestão), começando com
            "Revisor ${{ matrix.agente }}:". Se houver achado BLOQUEANTE, rode
            `gh pr edit ${{ github.event.pull_request.number }} --add-label bloqueado`.
            Se não houver problemas, diga isso em uma linha.
          claude_args: >-
            --model claude-sonnet-5-5 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr edit:*),Read,Grep,Glob"
