name: Publicar Tesouro de Marina

# Gera os PDFs da coleção O Grande Tesouro de Marina a partir de tesouro-marina/editorial e os publica
# como anexos da Release "tesouro-marina" (ADR 0011). Os PDFs não ficam no Git.
# - Em PR que altere tesouro-marina/: só gera e guarda os PDFs como artefato do workflow (para conferir).
# - Em merge no main que altere tesouro-marina/ (ou manualmente): gera e atualiza a Release.

on:
  pull_request:
    paths: ['tesouro-marina/**', '.github/workflows/publicar-tesouro.yml']
  push:
    branches: [main]
    paths: ['tesouro-marina/**', '.github/workflows/publicar-tesouro.yml']
  workflow_dispatch:

# Só leitura por padrão: o job que instala dependências não recebe permissão de publicar.
permissions:
  contents: read

# Cancela só execuções de PR: num merge no main, o segundo não pode interromper a publicação do primeiro
# (a Release ficaria com PDFs novos e antigos misturados).
concurrency:
  group: tesouro-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gerar:
    name: Gerar os PDFs
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: tesouro-marina/editorial
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: tesouro-marina/editorial/requirements.txt
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tesouro-marina/editorial/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: pip install -r requirements.txt
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Toda página de domínio público usada precisa ter SHA-256 registrado (falha fechada).
      - run: python3 fontes_v1.py verificar
      - run: python3 -m unittest -v test_fontes_v1 test_pdf
      # Cada script falha se algum bloco sair da área segura da página (pdf.js).
      - run: python3 build_amostra.py
      - run: python3 volume1.py
      - run: python3 volume2.py
      - run: python3 volume3.py
      - name: Juntar os PDFs
        run: |
          mkdir -p ../pdfs
          cp ../amostra/*.pdf ../volume*/*.pdf ../pdfs/
          ls -la ../pdfs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tesouro-marina-pdfs
          path: tesouro-marina/pdfs/
          retention-days: 14

  publicar:
    name: Atualizar a Release
    needs: gerar
    # Só publica a partir do main: um workflow_dispatch em branch de feature não pode sobrescrever a Release.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: tesouro-marina-pdfs
          path: pdfs
      - name: Criar ou atualizar a Release "tesouro-marina"
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view tesouro-marina >/dev/null 2>&1; then
            gh release create tesouro-marina --target "${{ github.sha }}" \
              --title "O Grande Tesouro de Marina — PDFs" \
              --notes "PDFs A4 da coleção O Grande Tesouro de Marina, gerados a partir de tesouro-marina/editorial. Arquivos *-impressao: fundo branco, para imprimir em papel creme. Arquivos *-tela: fundo creme, para ver na tela. Atualizada automaticamente a cada merge que altere tesouro-marina/."
          fi
          gh release upload tesouro-marina pdfs/*.pdf --clobber
          # Remove anexos antigos que não existem mais (PDF renomeado ou apagado).
          # (o envio acima não é atômico: um erro no meio deixa a Release parcial até o próximo merge)
          anexos=$(gh release view tesouro-marina --json assets -q '.assets[].name')
          while IFS= read -r nome; do
            [ -z "$nome" ] || [ -f "pdfs/$nome" ] || gh release delete-asset tesouro-marina "$nome" --yes
          done <<< "$anexos"
